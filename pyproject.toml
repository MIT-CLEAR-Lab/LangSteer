[tool.uv.sources]
calvin-env = { git = "https://github.com/mees/calvin_env.git", rev = "797142c588c21e76717268b7b430958dbd13bf48" }
clip = { git = "https://github.com/openai/CLIP.git", rev = "ded190a052fdf4585bd685cee5bc96e0310d2c93" }
openpi-client = { git = "https://github.com/Physical-Intelligence/openpi.git", rev = "215abfb217dbac7d5f1273282331b9b1866c0479", subdirectory = "packages/openpi-client" }

[tool.ruff.lint.per-file-ignores]
# Entry points put the repository root on sys.path before importing from it.
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the packaged CALVIN data, the real instruction artifacts or the CALVIN annotations (skipped when absent)",
    "gpu: needs a CUDA device (skipped without one)",
]
