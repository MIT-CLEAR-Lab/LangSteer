[project]
name = "langsteer"
version = "0.1.0"
description = "Language-conditioned steering of robot policies at inference time, evaluated on CALVIN"
readme = "README.md"
license = { text = "MIT" }
# CPython 3.10 on Linux x86_64.
requires-python = "==3.10.*"
# Exact versions; uv.lock pins the full environment.
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "numpy==2.2.6",
    "scipy==1.15.3",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "diffusers==0.36.0",
    "transformers==5.2.0",
    "einops==0.8.2",
    "tqdm==4.67.3",
    "anthropic==0.84.0",
    "openai==2.27.0",
    "blosc==1.11.4",
    "wandb==0.25.1",
    "pybullet==3.2.7",
    "opencv-python==4.13.0.92",
    "calvin-env",
    "clip",
    # pi0.5 websocket client (policies/pi05_guided.py); see [tool.uv] below for its numpy pin.
    "openpi-client",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "envs*", "policies*", "steering*", "training*", "utils*", "voxposer*", "pi05_guidance*"]
exclude = ["calvin*", "3d_diffuser_actor*", "conf*"]

[tool.uv]
# Supported platform: the one the results were produced on.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# openpi-client declares numpy<2 and dm-tree, but the client modules LangSteer imports
# (websocket client, msgpack_numpy, image tools) run on the evaluated numpy 2.2.6 and do
# not import dm-tree. These overrides replace the former `pip install --no-deps` step.
override-dependencies = [
    "numpy==2.2.6",
    "dm-tree; sys_platform == 'never'",
]
# Pinned transitive versions.
constraint-dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "antlr4-python3-runtime==4.9.3",
    "anyio==4.12.1",
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "click==8.3.1",
    "cloudpickle==3.1.2",
    "colorlog==6.10.1",
    "contourpy==1.3.2",
    "cuda-bindings==12.9.4",
    "cuda-pathfinder==1.3.4",
    "cycler==0.12.1",
    "distro==1.9.0",
    "docstring-parser==0.17.0",
    "exceptiongroup==1.3.1",
    "filelock==3.21.0",
    "fonttools==4.61.1",
    "fsspec==2026.2.0",
    "ftfy==6.3.1",
    "gitdb==4.0.12",
    "gitpython==3.1.46",
    "gym==0.26.2",
    "gym-notices==0.1.0",
    "h11==0.16.0",
    "hf-xet==1.2.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.4.1",
    "hydra-colorlog==1.2.0",
    "idna==3.11",
    "importlib-metadata==6.11.0",
    "iniconfig==2.3.0",
    "jinja2==3.1.6",
    "jiter==0.13.0",
    "kiwisolver==1.4.9",
    "llvmlite==0.46.0",
    "markdown-it-py==4.0.0",
    "markupsafe==3.0.3",
    "matplotlib==3.10.8",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "msgpack==1.2.1",
    "networkx==3.4.2",
    "numba==0.63.1",
    "numpy-quaternion==2024.0.13",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cuda-cupti-cu12==12.8.90",
    "nvidia-cuda-nvrtc-cu12==12.8.93",
    "nvidia-cuda-runtime-cu12==12.8.90",
    "nvidia-cudnn-cu12==9.10.2.21",
    "nvidia-cufft-cu12==11.3.3.83",
    "nvidia-cufile-cu12==1.13.1.3",
    "nvidia-curand-cu12==10.3.9.90",
