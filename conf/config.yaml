defaults:
  - _self_
  - env: calvin
  - policy: diffuser_actor_overloaded
  - steering: none
  - training: null   # set by scripts/train_diffuser_actor.py runs: training=diffuser_actor_overloaded

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

seed: 42
device: "cuda"

# Used only by scripts/run_experiment.py (the single-task debugging loop).
num_episodes: 10
